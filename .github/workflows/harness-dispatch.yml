name: Harness Dispatch

on:
  push:
    branches:
      - main
    paths:
      - .harness/task.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harness-dispatch-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Consume one published Harness task
    runs-on: [self-hosted]
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show published task
        run: python -c "from pathlib import Path; print(Path('.harness/task.json').read_text(encoding='utf-8'))"

      - name: Execute local Harness once
        id: harness
        env:
          HARNESS_COMMAND_JSON: ${{ vars.HARNESS_COMMAND_JSON }}
          HARNESS_TIMEOUT_SECONDS: ${{ vars.HARNESS_TIMEOUT_SECONDS || '3600' }}
        run: python harness/worker.py

      # The Harness should commit intentional project code/reports before it exits.
      # This helper only stages communication/worker state and deliberately avoids
      # `git add -A`, reducing the chance of publishing local model data, secrets,
      # caches, or unrelated generated files.
      - name: Record and push communication state
        if: always()
        run: python harness/record_state.py
