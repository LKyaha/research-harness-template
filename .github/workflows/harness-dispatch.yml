name: Harness Dispatch

on:
  push:
    branches:
      - main
    paths:
      - .harness/task.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: harness-dispatch-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Consume one published Harness task
    runs-on: [self-hosted]
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show published task
        run: python -c "from pathlib import Path; print(Path('.harness/task.json').read_text(encoding='utf-8'))"

      - name: Execute local Harness once
        id: harness
        env:
          HARNESS_COMMAND_JSON: ${{ vars.HARNESS_COMMAND_JSON }}
          HARNESS_TIMEOUT_SECONDS: ${{ vars.HARNESS_TIMEOUT_SECONDS || '3600' }}
        run: python harness/worker.py

      # The Harness should commit intentional project code/reports before it exits.
      # This helper only stages communication state and deliberately avoids `git add -A`.
      - name: Record and push communication state
        if: always()
        run: python harness/record_state.py

      - name: Open review pull request when requested
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.harness/last_worker_run.json';
            if (!fs.existsSync(path)) {
              core.info('No last_worker_run.json; no PR to open.');
              return;
            }

            const run = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (run.delivery_mode !== 'PULL_REQUEST') {
              core.info(`Delivery mode is ${run.delivery_mode}; no PR requested.`);
              return;
            }

            const { owner, repo } = context.repo;
            const head = `${owner}:${run.work_branch}`;
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
              base: run.base_branch,
              per_page: 10,
            });

            if (existing.data.length > 0) {
              core.info(`PR already exists: #${existing.data[0].number}`);
              return;
            }

            const failed = Number(run.worker_exit_code || 0) !== 0;
            const body = [
              `Automated Harness evidence package for \`${run.task_id}\`.`,
              '',
              `- Delivery: \`${run.delivery_mode}\``,
              `- Base: \`${run.base_branch}\``,
              `- Work branch: \`${run.work_branch}\``,
              `- Worker exit code: \`${run.worker_exit_code}\``,
              `- Worker error: ${run.worker_error ? `\`${run.worker_error}\`` : 'none reported'}`,
              '',
              'Review `HARNESS_OUTBOX.md`, the code/config diff, experiment evidence, and provenance records using `docs/REVIEW_PROTOCOL.md`.',
              '',
              'Do not promote tentative interpretations into canonical project state until review is complete.'
            ].join('\n');

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: `harness: ${run.task_id}`,
              head: run.work_branch,
              base: run.base_branch,
              body,
              draft: failed,
            });
            core.info(`Opened PR #${pr.data.number}`);
